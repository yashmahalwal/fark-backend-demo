# Uses the public fark-ai action: https://github.com/yashmahalwal/fark-ai
# Secrets (repo Settings → Secrets and variables → Actions):
#   FARK_GITHUB_TOKEN — PAT with repo access for MCP + checkout of frontend repos
#   OPENAI_API_KEY    — OpenAI API key
name: Fark AI — breaking API review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend (this PR)
        uses: actions/checkout@v4

      - name: Checkout frontend (web)
        uses: actions/checkout@v4
        with:
          repository: yashmahalwal/fark-frontend-demo
          ref: main
          path: frontends/web
          token: ${{ secrets.FARK_GITHUB_TOKEN }}

      - name: Checkout frontend (mobile)
        uses: actions/checkout@v4
        with:
          repository: yashmahalwal/fark-mobile-demo
          ref: main
          path: frontends/mobile
          token: ${{ secrets.FARK_GITHUB_TOKEN }}

      - name: Run fark-ai
        uses: yashmahalwal/fark-ai@main
        with:
          backend_github_token: ${{ secrets.FARK_GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          backend_owner: ${{ github.repository_owner }}
          backend_repo: ${{ github.event.repository.name }}
          backend_codebase_path: ${{ github.workspace }}
          frontends: |
            [
              {
                "repository": { "owner": "yashmahalwal", "repo": "fark-frontend-demo", "branch": "main" },
                "codebasePath": "frontends/web"
              },
              {
                "repository": { "owner": "yashmahalwal", "repo": "fark-mobile-demo", "branch": "main" },
                "codebasePath": "frontends/mobile"
              }
            ]
